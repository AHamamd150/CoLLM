# ============================================================================
# GNN Classifier Configuration - GCN
# ============================================================================

seed: 42
output_dir: "output_gnn"

# ============================================================================
# Data Configuration
# ============================================================================
data:
  signal_path: "data/signal_gnn.csv"
  background_path: "data/bkg_gnn.csv"
  train_size: 10000          # samples per class for training
  test_size: 2000            # samples per class for testing
  val_ratio: 0.15           # fraction of training data for validation
  normalize: true           # normalize features
  nodes_per_graph: 5        # Number of particles per graph

# ============================================================================
# Model Architecture - GCN
# ============================================================================
# GNN Types: EdgeConv, GCN, GAT
# Pooling: global_mean, global_max, global_add
# Activations: relu, gelu, tanh, sigmoid, leaky_relu, elu, selu
model:
  type: GCN
  layers:
    - out_channels: 64
      activation: relu
      batchnorm: true
      dropout: 0.1
    - out_channels: 64
      activation: relu
      improved: false
      batchnorm: true
      dropout: 0.1
    - out_channels: 64
      activation: relu
      improved: false
      batchnorm: false
      dropout: 0.0

  pooling: global_mean         # global pooling method
  output_units: 2              # 2 for binary classification
  output_activation: null      # null for logits

# ============================================================================
# Training Configuration
# ============================================================================
train:
  epochs: 10
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001         # L2 regularization
  optimizer: adam              # adam, adamw, sgd
  device: auto                 # auto, cpu, cuda, cuda:0, cuda:1

  # Early Stopping
  early_stopping: true
  early_stopping_patience: 15  # stop if no improvement for N epochs
  early_stopping_metric: val_loss  # val_loss or eval_metric

  # Training Precision
  precision: float32           # float32, float16, mixed

  # Learning Rate Scheduler
  scheduler:
    type: cosine               # none, step, plateau, cosine, onecycle
    # step_size: 10            # for step scheduler
    # gamma: 0.1               # LR multiplier
    # patience: 5              # for plateau scheduler
    min_lr: 0.000001           # minimum learning rate
    # max_lr: 0.01             # for onecycle scheduler

  # Evaluation Metric (for model selection and reporting)
  eval_metric: auc             # accuracy, auc, f1, recall, precision
